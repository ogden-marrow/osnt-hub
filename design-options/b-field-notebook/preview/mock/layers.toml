# Layer catalog. Every layer is streamed from the internet on demand; nothing is stored locally.
# kind:  xyz        standard {z}/{x}/{y} raster tiles
#        wms        WMS endpoint (set wms_layers)
#        terrarium  AWS/Mapzen Terrarium elevation tiles, rendered client-side as a colour ramp
# group: base (pick one) | overlay (toggle any)
# Override this file at runtime with OSNT_LAYERS=/path/to/layers.toml (re-read on every request).

[map]
center = [20.0, 0.0]
zoom = 2

[[layer]]
id = "osm"
name = "OpenStreetMap"
kind = "xyz"
group = "base"
default = true
url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
attribution = "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors"
max_zoom = 19

[[layer]]
id = "opentopomap"
name = "OpenTopoMap (terrain + contours)"
kind = "xyz"
group = "base"
url = "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png"
subdomains = ["a", "b", "c"]
attribution = "Map data &copy; OpenStreetMap contributors, SRTM | Style &copy; <a href='https://opentopomap.org'>OpenTopoMap</a> (CC-BY-SA)"
max_zoom = 17

[[layer]]
id = "blue-marble"
name = "NASA Blue Marble (shaded relief)"
kind = "xyz"
group = "base"
url = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief_Bathymetry/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg"
attribution = "Imagery &copy; NASA GIBS / EOSDIS"
max_zoom = 8

[[layer]]
id = "viirs-night"
name = "NASA night lights (VIIRS)"
kind = "xyz"
group = "base"
url = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png"
attribution = "Imagery &copy; NASA GIBS / EOSDIS"
max_zoom = 8

[[layer]]
id = "elevation"
name = "Elevation (colour ramp)"
kind = "terrarium"
group = "overlay"
url = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"
attribution = "Elevation: <a href='https://registry.opendata.aws/terrain-tiles/'>AWS Terrain Tiles</a> (SRTM, ETOPO1, others)"
max_zoom = 13
opacity = 0.6

[[layer]]
id = "seamark"
name = "OpenSeaMap (nautical)"
kind = "xyz"
group = "overlay"
url = "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png"
attribution = "&copy; <a href='https://www.openseamap.org'>OpenSeaMap</a> contributors"
max_zoom = 18

[[layer]]
id = "railways"
name = "OpenRailwayMap"
kind = "xyz"
group = "overlay"
url = "https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png"
subdomains = ["a", "b", "c"]
attribution = "&copy; <a href='https://www.openrailwaymap.org'>OpenRailwayMap</a>, OpenStreetMap contributors"
max_zoom = 19
