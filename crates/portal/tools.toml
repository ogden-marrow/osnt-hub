# Launcher catalog: grids of tool cards on the home page, in this order.
# Installed plugins add their own cards (from plugin.toml: name, description, grid) and are marked live or not running.
# A card listed here with no matching plugin is shown dimmed as "Planned" (status = "planned", the default);
# a plugin card with the same name replaces it. Empty grids are hidden on the page, so this file only fixes the
# ORDER of the groups. Override at runtime with OSNT_TOOLS=/path/to/tools.toml (re-read on every request).
#
#   [[grid.tool]]
#   name = "Something not built yet"
#   description = "One sentence."

