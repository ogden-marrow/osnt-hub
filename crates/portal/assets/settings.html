<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSNT Settings</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; font-family: system-ui, sans-serif; background: #0f1419; color: #e6e6e6; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #243040; font-size: 16px; letter-spacing: .08em; }
    header a, header button { color: #8aa; font-size: 12px; text-decoration: none; background: none; border: 0; cursor: pointer; letter-spacing: 0; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    nav { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid #243040; }
    nav button { background: none; color: #9fb0c0; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; padding: 8px 16px; cursor: pointer; font-size: 14px; }
    nav button[aria-selected="true"] { color: #e6e6e6; background: #151c24; border-color: #243040; }
    iframe { flex: 1; width: 100%; border: 0; background: #0f1419; }
  </style>
</head>
<body>
  <header><h1><a href="/" style="font-size:16px;color:inherit">&larr; OSNT</a> / SETTINGS</h1><button id="out">Sign out</button></header>
  <nav role="tablist">
    <button role="tab" data-src="/p/credentials/" aria-selected="true">API keys</button>
    <button role="tab" data-src="/p/packages/" aria-selected="false">Packages</button>
  </nav>
  <iframe id="frame" title="Settings"></iframe>
  <script>
    const frame = document.getElementById('frame');
    const tabs = [...document.querySelectorAll('[role=tab]')];
    function show(tab) {
      tabs.forEach(t => t.setAttribute('aria-selected', String(t === tab)));
      frame.src = tab.dataset.src;
      try { history.replaceState(null, '', '#' + tab.dataset.src.split('/')[2]); } catch {}
    }
    // Links inside a settings page (the "back to OSNT" link) should leave the frame, not nest the portal in it.
    frame.onload = () => { try { const d = frame.contentDocument; if (!d.querySelector('base')) { const b = d.createElement('base'); b.target = '_top'; d.head.prepend(b); } } catch {} };
    tabs.forEach(t => t.onclick = () => show(t));
    show(tabs.find(t => t.dataset.src.split('/')[2] === location.hash.slice(1)) || tabs[0]);
    document.getElementById('out').onclick = async () => { await fetch('/auth/logout', { method: 'POST' }); location.href = '/login'; };
  </script>
</body>
</html>
