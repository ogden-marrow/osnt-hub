<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSNT setup</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0f1419; color: #e6e6e6; }
    main { width: min(440px, 92vw); padding: 28px; border: 1px solid #243040; border-radius: 12px; background: #151c24; }
    h1 { margin: 0 0 6px; font-size: 18px; letter-spacing: .1em; }
    p { margin: 0 0 14px; font-size: 13px; color: #9fb0c0; line-height: 1.5; }
    label { display: block; margin: 12px 0 4px; font-size: 12px; color: #7f93a8; text-transform: uppercase; letter-spacing: .08em; }
    input { width: 100%; box-sizing: border-box; padding: 10px; background: #0f1419; color: inherit; border: 1px solid #2d3a4a; border-radius: 8px; font-size: 15px; }
    button { width: 100%; margin-top: 18px; padding: 12px; font-size: 15px; background: #1d3a34; color: #e6e6e6; border: 1px solid #2f6f5e; border-radius: 8px; cursor: pointer; }
    button:hover { border-color: #3fae91; } button:disabled { opacity: .6; cursor: wait; }
    #msg { margin-top: 14px; min-height: 18px; font-size: 13px; color: #ef6c6c; }
    code { font: 12px ui-monospace, monospace; background: #0b0f14; padding: 1px 5px; border-radius: 4px; }
    .closed { border: 1px solid #6f5e2f; background: #2a2414; border-radius: 8px; padding: 10px 12px; }
  </style>
</head>
<body>
  <main>
    <h1>OSNT setup</h1>
    <div id="open" hidden>
      <p>Welcome. Create the passkey you will use to sign in; there is no password. The first passkey on a new hub is yours, so do this now, before anyone else on your network visits this page.</p>
      <label for="name">Your name (a label for this passkey)</label>
      <input id="name" autocomplete="off" placeholder="e.g. John, iPhone">
      <button id="go">Create passkey</button>
    </div>
    <div id="msg"></div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const b64u = { dec: s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)),
                   enc: b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') };
    const post = (p, body) => fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

    async function create() {
      $('msg').textContent = ''; $('go').disabled = true;
      try {
        if (!window.PublicKeyCredential) throw new Error('This browser does not support passkeys (it needs HTTPS and a trusted certificate).');
        const name = $('name').value.trim();
        const begin = await post('/auth/setup/begin', { name });
        const opts = await begin.json();
        if (!begin.ok) throw new Error(opts.error);
        const pk = opts.publicKey;
        pk.challenge = b64u.dec(pk.challenge);
        pk.user.id = b64u.dec(pk.user.id);
        pk.excludeCredentials = pk.excludeCredentials.map(c => ({ ...c, id: b64u.dec(c.id) }));
        const cred = await navigator.credentials.create({ publicKey: pk });
        const fin = await post('/auth/setup/finish', { ceremony: opts.ceremony, name, response: {
          attestationObject: b64u.enc(cred.response.attestationObject), clientDataJSON: b64u.enc(cred.response.clientDataJSON) } });
        if (!fin.ok) throw new Error((await fin.json()).error);
        location.href = '/';
      } catch (e) { $('msg').textContent = e.name === 'NotAllowedError' ? 'Cancelled or timed out. Try again.' : e.message; }
      $('go').disabled = false;
    }
    $('go').onclick = create;
    fetch('/auth/status').then(r => r.json()).then(s => {
      if (s.configured) { location.href = s.logged_in ? '/' : '/login'; return; }
      $('open').hidden = false;
    });
  </script>
</body>
</html>
