<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Set up · OSNT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%230c7a62%27 stroke-width=%272.2%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%279%27/%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%273.2%27 fill=%27%230c7a62%27 stroke=%27none%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/osnt-ui.css">
  <style>
    body { display: grid; place-items: center; padding: 24px 16px; }
    .auth { width: min(460px, 100%); }
    .auth .mark { width: 40px; height: 40px; color: var(--accent); margin-bottom: 20px; }
    .auth h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
    .auth .card { padding: 24px; }
    .auth p { margin: 0 0 16px; color: var(--ink-2); }
    .auth .btn { margin-top: 20px; }
    #msg { margin-top: 16px; font-size: 13px; line-height: 1.5; color: var(--ink); background: var(--err-soft); border-left: 3px solid var(--err); border-radius: var(--radius-sm); padding: 10px 12px; overflow-wrap: anywhere; }
    #msg:empty { display: none; }
    #msg small { display: block; color: var(--ink-2); font-size: 12px; margin-top: 4px; }
    #msg br { display: none; }
    /* the environment check line is created by script with an inline style; restyle it here */
    main > p[style] { margin: 16px 4px 0 !important; text-align: center; font-size: 12px !important; color: var(--ink-3) !important; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="auth">
    <div class="card">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><path d="M12 3v4" stroke-linecap="round"/></svg>
      <h1>Set up OSNT</h1>
      <div id="open" hidden>
        <p>Create the passkey you will use to sign in. The first passkey on a new hub is yours, so do this now, before anyone else on your network visits this page.</p>
        <label class="field" for="name"><span class="label">Your name (a label for this passkey)</span>
          <input id="name" autocomplete="off" placeholder="e.g. John, iPhone"></label>
        <button id="go" class="btn primary lg block">Create passkey</button>
      </div>
      <div id="msg" role="alert" aria-live="assertive"></div>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const b64u = { dec: s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)),
                   enc: b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') };
    const post = (p, body) => fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

    async function create() {
      $('msg').textContent = ''; $('go').disabled = true;
      try {
        if (!window.PublicKeyCredential) throw new Error('This browser does not support passkeys (it needs HTTPS and a trusted certificate).');
        const name = $('name').value.trim();
        const begin = await post('/auth/setup/begin', { name });
        const opts = await begin.json();
        if (!begin.ok) throw new Error(opts.error);
        const pk = opts.publicKey;
        pk.challenge = b64u.dec(pk.challenge);
        pk.user.id = b64u.dec(pk.user.id);
        pk.excludeCredentials = pk.excludeCredentials.map(c => ({ ...c, id: b64u.dec(c.id) }));
        const cred = await navigator.credentials.create({ publicKey: pk });
        const fin = await post('/auth/setup/finish', { ceremony: opts.ceremony, name, response: {
          attestationObject: b64u.enc(cred.response.attestationObject), clientDataJSON: b64u.enc(cred.response.clientDataJSON) } });
        if (!fin.ok) throw new Error((await fin.json()).error);
        location.href = '/';
      } catch (e) { $('msg').innerHTML = (e.name === 'NotAllowedError' ? 'The browser did not complete the passkey step (you cancelled, it timed out, or this device cannot do it). ' : '') + '<br><small>Details: ' + (e.name || 'Error') + ': ' + (e.message || '').replace(/[<>&]/g, '') + '</small>'; }
      $('go').disabled = false;
    }
    $('go').onclick = create;
    (async () => {
      const note = document.createElement('p'); note.style.cssText = 'font-size:12px;color:#8aa;margin-top:14px';
      const secure = window.isSecureContext, api = !!window.PublicKeyCredential;
      let uv = false; try { uv = api && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch {}
      note.textContent = `Check: secure page ${secure ? 'yes' : 'NO'} · passkeys supported ${api ? 'yes' : 'NO'} · this device has biometrics/PIN for passkeys ${uv ? 'yes' : 'no (a phone or security key will be needed)'}`;
      document.querySelector('main').append(note);
    })();
    fetch('/auth/status').then(r => r.json()).then(s => {
      if (s.configured) { location.href = s.logged_in ? '/' : '/login'; return; }
      $('open').hidden = false;
    });
  </script>
</body>
</html>
