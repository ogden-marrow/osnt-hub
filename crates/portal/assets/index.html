<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSNT Portal</title>
  <link rel="stylesheet" href="/static/leaflet/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; background: #0f1419; color: #e6e6e6; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid #243040; }
    header h1 { margin: 0; font-size: 16px; letter-spacing: .08em; }
    #status { font-size: 12px; color: #8aa; }
    #map { flex: 1; }
  </style>
</head>
<body>
  <header><h1>OSNT PORTAL</h1><span id="status">connecting…</span></header>
  <div id="map"></div>
  <script src="/static/leaflet/leaflet.js"></script>
  <script>
    (async () => {
      const cfg = await (await fetch('/api/map-config')).json();
      const map = L.map('map', { worldCopyJump: true }).setView(cfg.center, cfg.zoom);
      L.tileLayer(cfg.tile_url, { attribution: cfg.attribution, maxZoom: 19 }).addTo(map);
      L.control.scale().addTo(map);
      try {
        const h = await (await fetch('/api/health')).json();
        document.getElementById('status').textContent = `server ${h.status} · v${h.version}`;
      } catch { document.getElementById('status').textContent = 'server unreachable'; }
    })();
  </script>
</body>
</html>
