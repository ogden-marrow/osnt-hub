<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSNT Portal</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: #0f1419; color: #e6e6e6; }
    header { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #243040; }
    header h1 { margin: 0; font-size: 16px; letter-spacing: .08em; }
    #status { font-size: 12px; color: #8aa; }
    main { max-width: 1100px; margin: 0 auto; padding: 8px 24px 48px; }
    h2 { margin: 28px 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #7f93a8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .card { display: block; padding: 16px; border: 1px solid #243040; border-radius: 8px; background: #151c24; color: inherit; text-decoration: none; min-height: 110px; }
    .card h3 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card p { margin: 0; font-size: 13px; line-height: 1.4; color: #9fb0c0; }
    .badge { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 999px; border: 1px solid #2d3a4a; color: #7f93a8; }
    a.card.live { border-color: #2f6f5e; }
    a.card.live:hover, a.card.live:focus-visible { background: #1a2a2a; border-color: #3fae91; outline: none; }
    a.card.live .badge { color: #3fae91; border-color: #2f6f5e; }
    div.card.planned { opacity: .55; cursor: default; }
  </style>
</head>
<body>
  <header><h1>OSNT PORTAL</h1><span><a href="/settings" style="color:#8aa;font-size:12px;margin-right:14px;text-decoration:none">Settings</a><span id="status">loading…</span></span></header>
  <main id="grids"></main>
  <script>
    (async () => {
      const root = document.getElementById('grids'), status = document.getElementById('status');
      let cfg;
      try { cfg = await (await fetch('/api/tools')).json(); }
      catch { status.textContent = 'could not load tools'; return; }
      let live = 0;
      for (const grid of cfg.grid) {
        const h = document.createElement('h2'); h.textContent = grid.name;
        const g = document.createElement('div'); g.className = 'grid';
        for (const t of grid.tool) {
          const isLive = t.status === 'live' && t.href;
          const card = document.createElement(isLive ? 'a' : 'div');
          card.className = `card ${isLive ? 'live' : 'planned'}`;
          if (isLive) { card.href = t.href; live++; }
          const title = document.createElement('h3');
          title.append(t.name);
          const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = isLive ? 'open' : (t.status === 'offline' ? 'offline' : 'planned');
          title.append(badge);
          const p = document.createElement('p'); p.textContent = t.description;
          card.append(title, p); g.append(card);
        }
        root.append(h, g);
      }
      status.textContent = `${live} live tool${live === 1 ? '' : 's'}`;
    })();
  </script>
</body>
</html>
